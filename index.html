<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hungry Circle</title>
<style>
  :root {
    --bg-color: #00BFFF;
    --grass-color: #7CB342;
    --dark-green: #1B5E20;
    --ui-dark: #2C3E50;
    --text-red: #E74C3C;
    --text-yellow: #F1C40F;
    --border-black: #000;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; font-family: Arial, sans-serif;
    user-select: none; touch-action: none;
  }

  #app {
    position: relative; width: 100vw; height: 100vh; max-width: 500px;
    margin: 0 auto; background: var(--bg-color);
    overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* --- Экран приветствия --- */
  #screen-welcome { background: #000; align-items: center; justify-content: center; z-index: 100; }
  #welcome-btn { width: 80%; max-width: 400px; cursor: pointer; transition: transform 0.2s; }
  #welcome-btn:active { transform: scale(0.95); }

  /* --- Главное меню --- */
  #screen-main { align-items: center; justify-content: center; }
  
  .title-container { position: absolute; top: 20px; display: flex; justify-content: center; width: 100%; }
  .title-oval { background: var(--grass-color); border: 6px solid var(--ui-dark); border-radius: 50px; padding: 10px 40px; }
  .title-text { font-size: 32px; font-weight: bold; color: var(--dark-green); margin: 0; font-family: 'Times New Roman', serif; }

  .play-btn-wrapper {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    width: 180px; height: 180px; cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn-wrapper:active { transform: translate(-50%, -50%) scale(0.95); }
  .play-btn-main {
    width: 100%; height: 100%; background: var(--grass-color); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }
  .play-triangle {
    width: 0; height: 0; border-top: 45px solid transparent; border-bottom: 45px solid transparent;
    border-left: 70px solid var(--dark-green); margin-left: 15px; pointer-events: none;
  }

  .bottom-menu {
    position: absolute; bottom: 5%; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 20px; z-index: 2;
  }
  
  .left-buttons { display: flex; flex-direction: column; gap: 15px; }
  .custom-btn {
    width: 80px; height: 80px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; text-align: center;
    font-size: 14px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 3px solid #fff;
  }
  .custom-btn:active { transform: scale(0.9); }
  #btn-skins { background: var(--text-red); color: #fff; }
  #btn-promo { background: var(--text-yellow); color: #000; border-color: var(--text-red); }

  .profile-panel {
    background: var(--ui-dark); border: 4px solid var(--border-black);
    border-radius: 10px; padding: 15px 10px; width: 160px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3); position: relative;
  }
  .admin-btn {
    background: #C0392B; color: #fff; border: 2px solid #000;
    border-radius: 15px; padding: 4px 10px; font-size: 12px; font-weight: bold;
    cursor: pointer; display: none; position: absolute; top: 5px; right: 5px;
  }
  .username {
    color: var(--text-red); font-size: 22px; font-weight: bold;
    margin-bottom: 10px; cursor: pointer; border-bottom: 2px dotted var(--text-red);
    text-align: center; word-break: break-all;
  }
  .trophies { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .trophy-icon { width: 40px; height: 40px; object-fit: contain; }
  .trophy-count { font-size: 36px; color: var(--text-red); font-weight: bold; }

  /* --- Выбор режима --- */
  #screen-modes { align-items: center; justify-content: center; z-index: 50; }
  .back-btn {
    position: absolute; top: 20px; left: 20px; background: var(--text-red);
    color: #fff; border: 4px solid var(--border-black); border-radius: 30px;
    padding: 10px 25px; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 100;
  }
  .back-btn:active { transform: scale(0.95); }

  .modes-container { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
  .mode-btn {
    width: 280px; height: 70px; background: #008000; border: 3px solid #004d00;
    border-radius: 10px; color: #90EE90; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.1s;
  }
  .mode-btn:active { transform: scale(0.95); }

  /* --- Экраны результатов --- */
  .screen-result { background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 80; }
  .result-img { width: 90%; max-width: 400px; cursor: pointer; transition: transform 0.1s; }
  .result-img:active { transform: scale(0.95); }

  /* --- Меню скинов --- */
  #screen-skins { align-items: center; justify-content: center; z-index: 50; }
  .skin-nav { display: flex; align-items: center; gap: 20px; margin-top: -50px; }
  .skin-preview-container { width: 220px; height: 220px; position: relative; display: flex; align-items: center; justify-content: center; }
  .skin-img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .arrow-btn { background: #F39C12; color: #fff; border: none; width: 60px; height: 150px; font-size: 50px; cursor: pointer; font-weight: bold; }
  .select-btn {
    margin-top: 50px; background: #F39C12; color: #fff; border: 5px solid #000;
    padding: 15px 40px; font-size: 28px; font-weight: bold; cursor: pointer; text-transform: uppercase;
  }
  .exit-btn {
    position: absolute; top: 20px; left: 20px; background: #E84C3D; color: #fff;
    border: 3px solid #000; border-radius: 30px; padding: 10px 25px; font-size: 20px;
    font-weight: bold; cursor: pointer; z-index: 100;
  }

  /* --- Экран игры --- */
  #screen-game { background: #000; z-index: 10; }
  #game-canvas { width: 100%; height: 100%; display: block; background: #fff; }

  .hud-top-left { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; z-index: 5; pointer-events: none; }
  .hud-counter-frame {
    position: relative; width: 140px; height: 50px; background: #8B4513;
    border: 4px solid #000; border-radius: 4px; margin-bottom: 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .hud-counter-text { color: #008000; font-size: 32px; font-weight: bold; font-family: Arial, sans-serif; }
  .hud-health { display: flex; align-items: center; gap: 5px; margin-left: -15px; }
  .hud-health-icon { width: 60px; height: 60px; object-fit: contain; }
  .hud-health-text { color: var(--text-red); font-size: 36px; font-weight: bold; text-shadow: 2px 2px 0 #000; margin-top: 15px; margin-left: -10px; }

  .hud-timer {
    position: absolute; top: 15px; right: 15px; background: #A0522D; color: #008000;
    font-size: 32px; font-weight: bold; padding: 2px 25px; border: 4px solid #000;
    font-family: monospace; display: none; z-index: 5;
  }

  .pause-btn-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; cursor: pointer; z-index: 10; }
  .pause-btn-top img { width: 100%; height: 100%; object-fit: contain; }

  /* --- Меню паузы --- */
  #pause-menu { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 20; }
  #pause-menu.active { display: flex; }
  .pause-btn {
    width: 280px; background: #008000; border: none; color: #90EE90; font-size: 24px;
    padding: 15px; text-align: center; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 10px;
  }
  .pause-btn:active { background: #006400; }
  .play-icon-svg { width: 30px; height: 30px; fill: #90EE90; }
</style>
</head>
<body>

<div id="app">
  
  <div id="screen-welcome" class="screen active">
    <img src="images/Мой актер или объект_32.png" id="welcome-btn" alt="Нажмите чтобы начать" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'blue\'/><text x=\'50\' y=\'55\' font-size=\'20\' text-anchor=\'middle\' fill=\'white\'>ВХОД</text></svg>'">
  </div>

  <div id="screen-main" class="screen">
    <div class="title-container">
      <div class="title-oval"><h1 class="title-text">Hungry Circle</h1></div>
    </div>
    
    <div class="play-btn-wrapper" id="btn-play">
      <div class="play-btn-main"><div class="play-triangle"></div></div>
    </div>
    
    <div class="bottom-menu">
      <div class="left-buttons">
        <div class="custom-btn" id="btn-skins">СКИНЫ</div>
        <div class="custom-btn" id="btn-promo">ПРОМО</div>
      </div>
      <div class="profile-panel">
        <button class="admin-btn" id="btn-admin">АДМИН</button>
        <div class="username" id="lbl-username">Alexb612</div>
        <div class="trophies">
          <img src="images/трофеи.png" class="trophy-icon" onerror="this.style.display='none'">
          <span class="trophy-count" id="lbl-trophies">0</span>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-modes" class="screen">
    <button class="back-btn" id="btn-exit-modes">Назад</button>
    <div class="modes-container">
      <div class="mode-btn" onclick="selectMode(1)">классика</div>
      <div class="mode-btn" onclick="selectMode(2)">бесконечный</div>
      <div class="mode-btn" onclick="selectMode(3)">на время ⏱</div>
      <div class="mode-btn" onclick="selectMode(4)">рандом</div>
    </div>
  </div>

  <div id="screen-skins" class="screen">
    <button class="exit-btn" id="btn-exit-skins">Выход</button>
    <div class="skin-nav">
      <button class="arrow-btn" id="btn-prev-skin">&lt;</button>
      <div class="skin-preview-container" id="skin-preview-container"></div>
      <button class="arrow-btn" id="btn-next-skin">&gt;</button>
    </div>
    <button class="select-btn" id="btn-select-skin">Выбрать</button>
  </div>

  <div id="screen-game" class="screen">
    <canvas id="game-canvas"></canvas>
    
    <div class="hud-top-left">
      <div class="hud-counter-frame">
        <div class="hud-counter-text" id="hud-strawberry-text">0</div>
      </div>
      <div class="hud-health">
        <img src="images/Мой актер или объект_8.png" class="hud-health-icon" onerror="this.style.display='none'">
        <span class="hud-health-text" id="hud-health-text">5</span>
      </div>
    </div>
    
    <div class="hud-timer" id="hud-timer">100</div>
    
    <div class="pause-btn-top" id="btn-pause">
      <img src="images/Мой актер или объект_5.png" alt="Пауза" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect x=\'20\' y=\'20\' width=\'20\' height=\'60\' fill=\'white\'/><rect x=\'60\' y=\'20\' width=\'20\' height=\'60\' fill=\'white\'/></svg>'">
    </div>

    <div id="pause-menu">
      <button class="pause-btn" id="btn-resume">
        <svg class="play-icon-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        продолжить
      </button>
      <button class="pause-btn" id="btn-center-strawberry">потерялась земляника?</button>
      <button class="pause-btn" id="btn-quit">выйти</button>
    </div>
  </div>

  <div id="screen-win" class="screen screen-result">
    <img src="images/Мой актер или объект_41.png" class="result-img" id="btn-win-ok" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><text x=\'50\' y=\'50\' font-size=\'20\' text-anchor=\'middle\' fill=\'white\'>ПОБЕДА! Нажми</text></svg>'">
  </div>

  <div id="screen-lose" class="screen screen-result">
    <img src="images/победа (1).png" class="result-img" id="btn-lose-ok" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><text x=\'50\' y=\'50\' font-size=\'20\' text-anchor=\'middle\' fill=\'red\'>ПОРАЖЕНИЕ. Нажми</text></svg>'">
  </div>

</div>

<script>
'use strict';

const W = 1080, H = 2208;
const CX = W / 2, CY = H / 2;
const px = x => CX + x;
const py = y => CY - y;

const S = {
  mode: 1, health: 5, berries: 0, timer: 100, trophies: 0, name: 'Alexb612', skin: 'змея_4',
  running: false, paused: false, gameOver: false
};

const SKINS = ['змея_4', 'змея_11', 'змея_12', 'змея_13', 'змея_14', 'змея_15', 'змея_16', 'змея_18', 'змея_19', 'змея_20', 'змея_21', 'змея_22', 'змея_25', 'змея_26', 'змея_28', 'змея_30'];
const ASSETS = {
  bg1: ['images/1000162300_0.jpg', 'images/Фон_4.png'],
  bg2: ['images/1000162565.jpg'],
  bg3: ['images/1000127511.jpg'],
  berry: ['images/Мой актер или объект_0.png'],
  fire: ['images/огонь.png'],
  log: ['images/1000162320_0.png']
};

const SVG_FALLBACKS = {
  berry: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 90 Q10 50 20 20 Q50 30 80 20 Q90 50 50 90 Z" fill="%23E74C3C"/><path d="M50 30 L40 10 M50 30 L60 10" stroke="green" stroke-width="4"/></svg>',
  fire: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 90 Q10 60 30 30 Q50 50 70 20 Q90 50 50 90 Z" fill="orange"/></svg>',
  log: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="0" y="0" width="100" height="100" fill="%238B4513"/><rect x="10" y="10" width="80" height="80" fill="%23A0522D" stroke="%23552a0a" stroke-width="4"/></svg>',
  bg1: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><rect width="100" height="200" fill="%2387CEEB"/></svg>',
  bg2: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><rect width="100" height="200" fill="%234682B4"/></svg>',
  bg3: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><rect width="100" height="200" fill="%235F9EA0"/></svg>'
};

const IMG = {};
const snake = { x: 0, y: 0, tx: 0, ty: 0, angle: 0, r: 70, baseR: 70, speed: 15 };
const berry = { x: 0, y: 0, r: 50, active: false };
const fire = { x: 0, y: 600, r: 30, active: false, vx: 4, vy: 4 };
const logs = [
  { x: -300, y: -200, w: 220, h: 100, vx: 150, vy: 0, minX: -400, maxX: 400 },
  { x: 300, y: 200, w: 220, h: 100, vx: -150, vy: 0, minX: -400, maxX: 400 },
  { x: 200, y: -600, w: 220, h: 100, vx: 0, vy: 150, minY: -800, maxY: 800 },
  { x: -200, y: 600, w: 220, h: 100, vx: 0, vy: -150, minY: -800, maxY: 800 }
];

function loadAsset(key) {
  const list = ASSETS[key];
  let i = 0;
  const next = () => {
    if (i >= list.length) {
      if (SVG_FALLBACKS[key]) { const img = new Image(); img.onload = () => IMG[key] = img; img.src = SVG_FALLBACKS[key]; }
      return;
    }
    const img = new Image();
    img.onload = () => IMG[key] = img;
    img.onerror = () => { i++; next(); };
    img.src = encodeURI(list[i]);
  };
  next();
}

Object.keys(ASSETS).forEach(loadAsset);
SKINS.forEach(name => { const img = new Image(); img.onload = () => IMG[name] = img; img.src = `images/${name}.png`; });

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadSave() {
  S.trophies = parseInt(localStorage.getItem('trophies') || '0');
  S.name = localStorage.getItem('username') || 'Alexb612';
  const savedSkin = localStorage.getItem('skin');
  if (savedSkin && SKINS.includes(savedSkin)) S.skin = savedSkin;
  
  document.getElementById('lbl-username').innerText = S.name;
  document.getElementById('lbl-trophies').innerText = S.trophies;

  if (!localStorage.getItem('hasPlayed')) showScreen('screen-welcome');
  else { showScreen('screen-main'); if (localStorage.getItem('isAdmin') === 'true') document.getElementById('btn-admin').style.display = 'block'; }
}

function save() {
  localStorage.setItem('trophies', S.trophies);
  localStorage.setItem('username', S.name);
  localStorage.setItem('skin', S.skin);
}

document.getElementById('welcome-btn').onclick = () => {
  const name = prompt('Введите ваш никнейм:', 'Игрок');
  if (name && name.trim()) {
    S.name = name.trim();
    localStorage.setItem('username', S.name);
    localStorage.setItem('hasPlayed', 'true');
    document.getElementById('lbl-username').innerText = S.name;
    showScreen('screen-main');
  }
};

document.getElementById('btn-play').onclick = () => showScreen('screen-modes');
document.getElementById('btn-exit-modes').onclick = () => showScreen('screen-main');
document.getElementById('btn-skins').onclick = () => showScreen('screen-skins');
document.getElementById('btn-exit-skins').onclick = () => showScreen('screen-main');

document.getElementById('btn-promo').onclick = () => {
  const code = prompt('Введите промокод:');
  if (!code) return;
  if (code.toUpperCase() === 'HUNGRY') { S.trophies += 50; save(); loadSave(); alert('Промокод принят! +50 трофеев.'); }
  else if (code === 'Чувак, Je Lantern ты конечно крутой и спасибо что помогаешь но админку дать не могу, прости') {
    localStorage.setItem('isAdmin', 'true');
    document.getElementById('btn-admin').style.display = 'block';
    alert('Админ-режим активирован!');
  } else alert('Неверный код.');
};

document.getElementById('lbl-username').onclick = () => {
  const name = prompt('Введите ваш никнейм:', S.name);
  if (name && name.trim()) { S.name = name.trim(); document.getElementById('lbl-username').innerText = S.name; save(); }
};

document.getElementById('btn-admin').onclick = () => { S.trophies += 1000; save(); loadSave(); alert('+1000 трофеев.'); };

let skinIdx = SKINS.indexOf(S.skin) !== -1 ? SKINS.indexOf(S.skin) : 0;
const preview = document.getElementById('skin-preview-container');

function updateSkinPreview() {
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.src = `images/${SKINS[skinIdx]}.png`;
  img.className = 'skin-img';
  img.style.display = 'block';
  img.onerror = () => { img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%237CB342"/><circle cx="30" cy="40" r="8" fill="black"/><circle cx="70" cy="40" r="8" fill="black"/></svg>'; };
  preview.appendChild(img);
}

document.getElementById('btn-prev-skin').onclick = () => { skinIdx = (skinIdx - 1 + SKINS.length) % SKINS.length; updateSkinPreview(); };
document.getElementById('btn-next-skin').onclick = () => { skinIdx = (skinIdx + 1) % SKINS.length; updateSkinPreview(); };
document.getElementById('btn-select-skin').onclick = () => { S.skin = SKINS[skinIdx]; save(); showScreen('screen-main'); };
updateSkinPreview();

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

canvas.addEventListener('pointermove', (e) => {
  if (!S.running || S.paused) return;
  const rect = canvas.getBoundingClientRect();
  snake.tx = ((e.clientX - rect.left) / rect.width * W) - CX;
  snake.ty = CY - ((e.clientY - rect.top) / rect.height * H);
});

function selectMode(mode) {
  S.mode = mode;
  showScreen('screen-game');
  startGame();
}

function startGame() {
  S.running = true; S.paused = false; S.gameOver = false;
  S.health = 5; S.berries = 0;
  snake.r = S.mode === 3 ? snake.baseR * 0.7 : snake.baseR;
  document.getElementById('hud-timer').style.display = S.mode === 3 ? 'block' : 'none';
  
  if (S.mode === 3) S.timer = 100;
  
  snake.x = 0; snake.y = 0; snake.tx = 0; snake.ty = 0;
  spawnBerry();
  
  logs[0].x = -300; logs[0].y = -200;
  logs[1].x = 300; logs[1].y = 200;
  logs[2].x = 200; logs[2].y = -600;
  logs[3].x = -200; logs[3].y = 600;

  fire.active = false;
  setTimeout(() => { if (S.running) { fire.active = true; fire.x = 0; fire.y = 600; fire.vx = 5; fire.vy = 5; } }, 3000);
  updateHUD();
}

function updateHUD() {
  if (S.mode === 3) document.getElementById('hud-timer').textContent = Math.ceil(S.timer);
  document.getElementById('hud-strawberry-text').textContent = S.berries;
  document.getElementById('hud-health-text').textContent = S.health;
}

function spawnBerry() {
  berry.x = -CX + 200 + Math.random() * (W - 400);
  berry.y = -CY + 300 + Math.random() * (H - 600);
  berry.active = true;
}

document.getElementById('btn-win-ok').onclick = () => { showScreen('screen-main'); loadSave(); };
document.getElementById('btn-lose-ok').onclick = () => { showScreen('screen-main'); loadSave(); };

document.getElementById('btn-pause').onclick = () => { if (S.running) { S.paused = true; document.getElementById('pause-menu').classList.add('active'); } };
document.getElementById('btn-resume').onclick = () => { S.paused = false; document.getElementById('pause-menu').classList.remove('active'); };
document.getElementById('btn-center-strawberry').onclick = () => { berry.x = 0; berry.y = 0; S.paused = false; document.getElementById('pause-menu').classList.remove('active'); };
document.getElementById('btn-quit').onclick = () => { S.running = false; S.paused = false; document.getElementById('pause-menu').classList.remove('active'); showScreen('screen-main'); loadSave(); };

function update(dt) {
  if (!S.running || S.paused || S.gameOver) return;

  const dx = snake.tx - snake.x, dy = snake.ty - snake.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 10) {
    snake.angle = Math.atan2(dy, dx) + Math.PI / 2;
    snake.x += (dx / dist) * snake.speed * dt * 60;
    snake.y += (dy / dist) * snake.speed * dt * 60;
  }

  logs.forEach(l => {
    l.x += l.vx * dt; l.y += l.vy * dt;
    if (l.vy !== 0) { if (l.y > l.maxY && l.vy > 0) l.vy *= -1; if (l.y < l.minY && l.vy < 0) l.vy *= -1; }
    else { if (l.x > l.maxX && l.vx > 0) l.vx *= -1; if (l.x < l.minX && l.vx < 0) l.vx *= -1; }
  });

  logs.forEach(l => {
    const cX = Math.max(l.x - l.w / 2, Math.min(snake.x, l.x + l.w / 2));
    const cY = Math.max(l.y - l.h / 2, Math.min(snake.y, l.y + l.h / 2));
    const dX = snake.x - cX, dY = snake.y - cY;
    if (dX * dX + dY * dY < snake.r * snake.r) {
      const a = Math.atan2(dY, dX);
      snake.x = cX + Math.cos(a) * snake.r;
      snake.y = cY + Math.sin(a) * snake.r;
    }
  });

  if (berry.active && Math.hypot(snake.x - berry.x, snake.y - berry.y) < snake.r + berry.r) {
    S.berries++; updateHUD(); spawnBerry();
    if (S.berries >= 30) { S.running = false; if (S.mode !== 2) { S.trophies += 5; save(); } showScreen('screen-win'); }
  }

  if (fire.active) {
    fire.x += fire.vx * dt * 60; fire.y += fire.vy * dt * 60;
    if (fire.x - fire.r < -CX || fire.x + fire.r > CX) fire.vx *= -1;
    if (fire.y - fire.r < -CY || fire.y + fire.r > CY) fire.vy *= -1;
    if (Math.hypot(snake.x - fire.x, snake.y - fire.y) < snake.r + fire.r) {
      S.health--; updateHUD();
      if (S.health <= 0) { S.running = false; S.gameOver = true; showScreen('screen-lose'); }
      fire.vx *= -1; fire.vy *= -1;
    }
  }

  if (S.mode === 3) {
    S.timer -= dt; updateHUD();
    if (S.timer <= 0) { S.running = false; showScreen('screen-lose'); }
  }
}

function drawSprite(key, x, y, scalePercent, rot = 0) {
  const img = IMG[key];
  if (!img) return;
  const s = (scalePercent / 100) * (W / 1080);
  const w = (img.width || 100) * s;
  const h = img.height * s;
  ctx.save();
  ctx.translate(px(x), py(y));
  if (rot) ctx.rotate(rot);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const bgKey = S.mode === 2 ? 'bg2' : (S.mode === 3 ? 'bg3' : 'bg1');
  const bg = IMG[bgKey];
  if (bg) {
    const s = Math.max(W / (bg.width || 1), H / (bg.height || 1));
    ctx.drawImage(bg, (W - (bg.width || W) * s) / 2, (H - (bg.height || H) * s) / 2, (bg.width || W) * s, (bg.height || H) * s);
  } else { ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, W, H); }

  if (!S.running && !S.paused) return;

  logs.forEach(l => {
    const img = IMG.log;
    if (img) { ctx.save(); ctx.translate(px(l.x), py(l.y)); ctx.drawImage(img, -l.w / 2, -l.h / 2, l.w, l.h); ctx.restore(); }
    else { ctx.fillStyle = '#8B4513'; ctx.fillRect(px(l.x - l.w / 2), py(l.y + l.h / 2), l.w, l.h); }
  });

  if (berry.active) drawSprite('berry', berry.x, berry.y, 60);
  if (fire.active) drawSprite('fire', fire.x, fire.y, 25);
  drawSprite(S.skin, snake.x, snake.y, S.mode === 3 ? 15 : 20, snake.angle);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

loadSave();
requestAnimationFrame(loop);
</script>
</body>
